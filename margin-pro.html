<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AhWinGo維持率">
  <meta name="theme-color" content="#080b11">
  <title>AhWinGo PRO — 個股融資維持率雙引擎精算儀 (私密授權版)</title>
  <style>

    :root {
      --bg-primary: #080b11;
      --bg-secondary: #101622;
      --bg-card: rgba(16, 22, 34, 0.85);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(99, 102, 241, 0.55);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-indigo: #6366f1;
      --accent-cyan: #38bdf8;
      --accent-amber: #f59e0b;
      --up-red: #ff4d4f;
      --down-green: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 50% 0%, #131c31 0%, #080b11 70%);
      color: var(--text-primary);
      font-family: 'Outfit', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      padding-bottom: 60px;
      line-height: 1.45;
    }

    /* Top Header */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8, 11, 17, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      padding: max(12px, env(safe-area-inset-top)) 16px 12px;
    }

    .top-bar-inner {
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .brand-wrap {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }

    .brand-logo {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 55%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-tag {
      font-size: 0.72rem;
      color: var(--text-secondary);
      background: rgba(99, 102, 241, 0.14);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #a5b4fc;
      padding: 2px 8px;
      border-radius: 99px;
      font-weight: 600;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-pill {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-primary);
      padding: 6px 11px;
      border-radius: 9px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn-pill:hover {
      background: rgba(99, 102, 241, 0.2);
      border-color: rgba(99, 102, 241, 0.45);
    }

    /* Main Container */
    .container {
      max-width: 1240px;
      margin: 16px auto 0;
      padding: 0 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    /* Input / Paste Stock List Panel */
    .paste-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .paste-title {
      font-size: 0.98rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #e2e8f0;
    }

    .preset-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .btn-preset {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #7dd3fc;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-preset:hover, .btn-preset.active {
      background: rgba(56, 189, 248, 0.24);
      border-color: #38bdf8;
      color: #fff;
    }

    .paste-box-wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .paste-textarea {
      width: 100%;
      min-height: 74px;
      background: rgba(8, 11, 17, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 11px;
      padding: 10px 12px;
      color: #f8fafc;
      font-size: 0.85rem;
      font-family: 'Outfit', 'Noto Sans TC', monospace;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }

    .paste-textarea:focus {
      border-color: var(--accent-indigo);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }

    .paste-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }

    .paste-btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn-run {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      border: 1px solid rgba(129, 140, 248, 0.45);
      color: #fff;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
      transition: all 0.18s;
    }

    .btn-run:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(99, 102, 241, 0.5);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #cbd5e1;
      padding: 8px 13px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    .btn-excel {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-excel:hover {
      background: rgba(16, 185, 129, 0.28);
      color: #fff;
    }

    .btn-copy-tsv {
      background: rgba(245, 158, 11, 0.14);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fbbf24;
      padding: 8px 13px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-copy-tsv:hover {
      background: rgba(245, 158, 11, 0.26);
      color: #fff;
    }

    /* Summary KPI Grid */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    @media (max-width: 640px) {
      .kpi-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .kpi-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 11px;
      padding: 9px 12px;
      text-align: center;
    }

    .kpi-label {
      font-size: 0.72rem;
      color: var(--text-secondary);
      margin-bottom: 2px;
    }

    .kpi-val {
      font-size: 1.15rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    /* Progress Bar */
    .progress-wrap {
      display: none;
      margin: 10px 0;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      font-size: 0.76rem;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .progress-track {
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #38bdf8, #10b981);
      transition: width 0.2s ease;
    }

    /* Filter & Sort Controls */
    .controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
    }

    .search-input {
      flex: 1;
      min-width: 200px;
      background: rgba(8, 11, 17, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 8px 12px;
      color: #fff;
      font-size: 0.84rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent-indigo);
    }

    .sort-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .sort-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-secondary);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .sort-btn.active {
      background: rgba(99, 102, 241, 0.2);
      border-color: #6366f1;
      color: #fff;
    }

    /* Responsive Table */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table.margin-tbl {
      width: 100%;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }

    table.margin-tbl th {
      text-align: right;
      padding: 10px 8px;
      font-size: 0.75rem;
      color: var(--text-secondary);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }

    table.margin-tbl th:first-child {
      text-align: left;
    }

    table.margin-tbl td {
      padding: 10px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      vertical-align: middle;
      text-align: right;
      font-size: 0.86rem;
    }

    table.margin-tbl td:first-child {
      text-align: left;
    }

    table.margin-tbl tbody tr {
      cursor: pointer;
      transition: background 0.15s;
    }

    table.margin-tbl tbody tr:hover {
      background: rgba(99, 102, 241, 0.08);
    }

    /* Hide desktop-only columns on narrow mobile screens so phone layout stays crisp */
    @media (max-width: 767px) {
      .col-desktop {
        display: none;
      }
      table.margin-tbl th, table.margin-tbl td {
        padding: 9px 5px;
      }
    }

    .stock-code-badge {
      display: inline-block;
      background: rgba(99, 102, 241, 0.16);
      border: 1px solid rgba(99, 102, 241, 0.35);
      color: #a5b4fc;
      font-weight: 700;
      font-size: 0.76rem;
      padding: 1px 6px;
      border-radius: 5px;
      margin-right: 4px;
    }

    .stock-name-txt {
      font-weight: 700;
      color: #f1f5f9;
      font-size: 0.9rem;
    }

    .badge-tag {
      display: inline-block;
      font-size: 0.66rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
      margin-left: 4px;
      vertical-align: middle;
    }
    .b-danger { background: rgba(16, 185, 129, 0.18); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.4); }
    .b-warn   { background: rgba(245, 158, 11, 0.18); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
    .b-lock   { background: rgba(255, 77, 79, 0.18); color: #ff4d4f; border: 1px solid rgba(255, 77, 79, 0.4); }
    .b-clean  { background: rgba(56, 189, 248, 0.18); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.4); }

    .mini-bar {
      width: 68px;
      height: 5px;
      background: rgba(255,255,255,0.08);
      border-radius: 3px;
      overflow: hidden;
      display: inline-flex;
      margin-top: 3px;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .modal-card {
      background: #101624;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 18px;
      width: 100%;
      max-width: 640px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 18px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.6);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }

    .modal-close {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #fff;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .toast-msg {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(16, 185, 129, 0.95);
      color: #fff;
      padding: 10px 20px;
      border-radius: 99px;
      font-size: 0.85rem;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      z-index: 300;
      display: none;
    }
  
    /* Lock Screen Overlay */
    #lock-screen {
      min-height: 82vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .lock-card {
      width: 100%;
      max-width: 400px;
      background: rgba(16, 23, 38, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 22px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(99, 102, 241, 0.12);
    }
    .lock-icon {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.25), rgba(168, 85, 247, 0.2));
      border: 1px solid rgba(129, 140, 248, 0.4);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.9rem;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.25);
    }
    .lock-title {
      font-size: 1.35rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 60%, #fbbf24 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .lock-sub {
      font-size: 0.8rem;
      color: var(--text-sub);
      line-height: 1.5;
      margin-bottom: 22px;
    }
    .lock-input {
      width: 100%;
      background: rgba(8, 11, 17, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      color: #fff;
      padding: 13px 14px;
      font-size: 0.95rem;
      text-align: center;
      letter-spacing: 1px;
      outline: none;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }
    .lock-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }
    .lock-btn {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.35);
      transition: all 0.15s;
    }
    .lock-btn:active {
      transform: scale(0.98);
    }
    .lock-err {
      color: #f87171;
      font-size: 0.78rem;
      margin-top: 12px;
      display: none;
      font-weight: 600;
    }
    .lock-badge {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.68rem;
      color: var(--text-muted);
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div id="lock-screen">
    <div class="lock-card">
      <div class="lock-icon">🔐</div>
      <div class="lock-title">AhWinGo PRO 私密精算儀</div>
      <div class="lock-sub">
        本系統核心演算法與觀察池受 <b>SHA-256 / 256-bit 金鑰</b> 加密保護。<br>
        請輸入專屬授權密碼以即時解密載入：
      </div>
      <form onsubmit="event.preventDefault(); unlockWithPassword();">
        <input type="password" id="pwd-input" class="lock-input" placeholder="請輸入專屬授權密碼..." autocomplete="current-password" autofocus>
        <button type="submit" id="unlock-btn" class="lock-btn">🔓 解密並啟動精算儀</button>
      </form>
      <div id="lock-err" class="lock-err">❌ 授權密碼錯誤，無法解密核心演算法</div>
      <div class="lock-badge">
        🛡️ 零明文保護：未輸入正確金鑰前，原始碼不含任何演算法與股池。<br>
        驗證通過後將自動記憶於本裝置瀏覽器。
      </div>
    </div>
  </div>

  <div id="app-root" style="display:none;"></div>

  <script>

    // Pure-JS SHA-256 (works in all browsers, HTTPS, and local file://)
    function sha256Bytes(bytes) {
      const K = [
        0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
        0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
        0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
        0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
        0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
        0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
        0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
        0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
      ];
      let H0=0x6a09e667, H1=0xbb67ae85, H2=0x3c6ef372, H3=0xa54ff53a,
          H4=0x510e527f, H5=0x9b05688c, H6=0x1f83d9ab, H7=0x5be0cd19;
      const l = bytes.length;
      const bitLenHi = Math.floor((l * 8) / 0x100000000);
      const bitLenLo = (l * 8) >>> 0;
      const padLen = ((l + 9 + 63) & ~63);
      const msg = new Uint8Array(padLen);
      msg.set(bytes);
      msg[l] = 0x80;
      const dv = new DataView(msg.buffer);
      dv.setUint32(padLen - 8, bitLenHi, false);
      dv.setUint32(padLen - 4, bitLenLo, false);
      const W = new Uint32Array(64);
      for (let off = 0; off < padLen; off += 64) {
        for (let i = 0; i < 16; i++) W[i] = dv.getUint32(off + i * 4, false);

    function bytesToHex(bytes) {
      let s = '';
      for (let i = 0; i < bytes.length; i++) s += bytes[i].toString(16).padStart(2, '0');
      return s;
    }

    function hexToBytes(hex) {
      const out = new Uint8Array(hex.length / 2);
      for (let i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
      return out;
    }

    function deriveKeyFromPassword(pwd) {
      const enc = new TextEncoder();
      let k = sha256Bytes(enc.encode(SALT + ":" + pwd));
      for (let i = 0; i < 10000; i++) k = sha256Bytes(k);
      return k;
    }

    function tryDecryptWithKey(keyBytes) {
      const keyHex = bytesToHex(keyBytes);
      const checkHash = bytesToHex(sha256Bytes(new TextEncoder().encode("VERIFY:" + keyHex)));
      if (checkHash !== VERIFY_HASH) return false;

      // Base64 decode CIPHERTEXT_B64
      const binStr = atob(CIPHERTEXT_B64);
      const cipherLen = binStr.length;
      const plainBytes = new Uint8Array(cipherLen);
      const numBlocks = Math.ceil(cipherLen / 32);
      const blockInput = new Uint8Array(36);
      blockInput.set(keyBytes, 0);
      const bdv = new DataView(blockInput.buffer);

      for (let bIdx = 0; bIdx < numBlocks; bIdx++) {
        bdv.setUint32(32, bIdx, false);
        const ks = sha256Bytes(blockInput);
        const start = bIdx * 32;
        const end = Math.min(start + 32, cipherLen);
        for (let i = start; i < end; i++) {
          plainBytes[i] = binStr.charCodeAt(i) ^ ks[i - start];
        }
      }

      const jsonStr = new TextDecoder('utf-8').decode(plainBytes);
      const payload = JSON.parse(jsonStr);

      // Save derived key in localStorage
      localStorage.setItem('ahwingo_pro_key_v1', keyHex);

      // Mount UI and execute core script
      document.getElementById('lock-screen').style.display = 'none';
      const appRoot = document.getElementById('app-root');
      appRoot.style.display = 'block';
      appRoot.innerHTML = payload.html;

      const scriptEl = document.createElement('script');
      scriptEl.textContent = payload.js;
      document.body.appendChild(scriptEl);
      return true;
    }

    function unlockWithPassword() {
      const input = document.getElementById('pwd-input');
      const errEl = document.getElementById('lock-err');
      const pwd = (input.value || '').trim();
      if (!pwd) return;

      const keyBytes = deriveKeyFromPassword(pwd);
      if (!tryDecryptWithKey(keyBytes)) {
        errEl.style.display = 'block';
        input.value = '';
        input.focus();
      }
    }

    // Auto-unlock if device already has valid derived key
    (function autoUnlock() {
      try {
        const savedKeyHex = localStorage.getItem('ahwingo_pro_key_v1');
        if (savedKeyHex && savedKeyHex.length === 64) {
          if (tryDecryptWithKey(hexToBytes(savedKeyHex))) return;
          localStorage.removeItem('ahwingo_pro_key_v1');
        }
      } catch (e) {}
    })();
