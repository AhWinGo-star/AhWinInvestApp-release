<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AhWinGo PRO">
  <meta name="theme-color" content="#080b11">
  <title>AhWinGo PRO — 台股多維度選股 ＆ 左側價值分析儀表板 (私密授權版)</title>
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon.png">
  <style>

    :root {
      --bg-primary: #080b11;
      --bg-secondary: #101622;
      --bg-card: rgba(16, 22, 34, 0.86);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(99, 102, 241, 0.55);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-indigo: #6366f1;
      --accent-cyan: #38bdf8;
      --accent-amber: #f59e0b;
      --up-red: #ff4d4f;
      --down-green: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 50% 0%, #141e33 0%, #080b11 72%);
      color: var(--text-primary);
      font-family: 'Outfit', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      padding-bottom: 64px;
      line-height: 1.45;
    }

    /* Sticky Top Header */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8, 11, 17, 0.9);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border-subtle);
      padding: max(12px, env(safe-area-inset-top)) 16px 12px;
    }

    .top-bar-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .brand-wrap {
      display: flex;
      align-items: baseline;
      gap: 9px;
      flex-wrap: wrap;
    }

    .brand-logo {
      font-size: 1.38rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 45%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-tag {
      font-size: 0.72rem;
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.32);
      color: #7dd3fc;
      padding: 2px 9px;
      border-radius: 99px;
      font-weight: 600;
    }

    .top-actions {
      display: flex;
      gap: 7px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn-pill {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-primary);
      padding: 6px 11px;
      border-radius: 9px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
    }

    .btn-pill:hover {
      background: rgba(99, 102, 241, 0.22);
      border-color: rgba(99, 102, 241, 0.5);
    }

    .btn-pill-gold {
      background: rgba(245, 158, 11, 0.14);
      border-color: rgba(245, 158, 11, 0.38);
      color: #fbbf24;
    }

    .btn-pill-gold:hover {
      background: rgba(245, 158, 11, 0.28);
    }

    /* Main Container */
    .container {
      max-width: 1280px;
      margin: 16px auto 0;
      padding: 0 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    /* Sub-Navigation Bar */
    .main-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      background: rgba(16, 22, 34, 0.9);
      border: 1px solid var(--border-subtle);
      padding: 6px;
      border-radius: 14px;
    }

    @media (max-width: 680px) {
      .main-tabs {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .main-tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-secondary);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .main-tab-btn:hover {
      color: #f8fafc;
      background: rgba(255, 255, 255, 0.04);
    }

    .main-tab-btn.active {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.28), rgba(56, 189, 248, 0.2));
      border-color: rgba(99, 102, 241, 0.55);
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.22);
    }

    .tab-section {
      display: none;
      flex-direction: column;
      gap: 14px;
    }

    .tab-section.active {
      display: flex;
    }

    /* Watchlist Bar */
    .watchlist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }

    .section-title {
      font-size: 1rem;
      font-weight: 700;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .select-styled, .input-styled {
      background: rgba(8, 11, 17, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 9px 12px;
      color: #f8fafc;
      font-size: 0.86rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .select-styled:focus, .input-styled:focus {
      border-color: var(--accent-indigo);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }

    .preset-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .btn-preset {
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.28);
      color: #7dd3fc;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-preset:hover, .btn-preset.active {
      background: rgba(56, 189, 248, 0.25);
      border-color: #38bdf8;
      color: #fff;
    }

    .btn-run {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      border: 1px solid rgba(129, 140, 248, 0.5);
      color: #fff;
      padding: 9px 18px;
      border-radius: 10px;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
      transition: all 0.18s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-run:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(99, 102, 241, 0.5); }
    .btn-run:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    .btn-gold {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      border: none;
      color: #080b11;
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.28);
      transition: all 0.18s;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #cbd5e1;
      padding: 8px 13px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-secondary:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }

    .btn-excel {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-excel:hover { background: rgba(16, 185, 129, 0.28); color: #fff; }

    /* KPI Grid */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    @media (max-width: 700px) {
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .kpi-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 11px 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
    }

    .kpi-box:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(99, 102, 241, 0.4);
    }

    .kpi-label { font-size: 0.74rem; color: var(--text-secondary); margin-bottom: 3px; }
    .kpi-val { font-size: 1.25rem; font-weight: 800; font-variant-numeric: tabular-nums; }

    /* Progress Bar */
    .progress-wrap {
      display: none;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 12px;
      padding: 12px 14px;
      margin-top: 10px;
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 7px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #38bdf8, #10b981);
      border-radius: 99px;
      transition: width 0.2s ease;
    }

    /* Screening Settings Grid */
    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      margin: 12px 0;
      padding: 12px;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      align-items: center;
    }

    .setting-item label {
      display: block;
      font-size: 0.76rem;
      color: var(--text-secondary);
      margin-bottom: 4px;
      font-weight: 600;
    }

    /* Result Row & Badges */
    .result-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .result-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .result-row {
      background: rgba(255, 255, 255, 0.028);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 12px;
      padding: 11px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      transition: border-color 0.15s, background 0.15s;
    }

    .result-row:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(99, 102, 241, 0.35);
    }

    .stock-main-left {
      flex: 1;
      min-width: 220px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stock-title-line {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
    }

    .stock-code-badge {
      background: rgba(99, 102, 241, 0.18);
      border: 1px solid rgba(99, 102, 241, 0.35);
      color: #c7d2fe;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 0.78rem;
      cursor: pointer;
    }

    .stock-name-btn {
      font-weight: 700;
      font-size: 0.94rem;
      color: #f8fafc;
      cursor: pointer;
      text-decoration: underline dashed rgba(255, 255, 255, 0.25);
      text-underline-offset: 3px;
    }

    .stock-name-btn:hover { color: #38bdf8; }

    .badges-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .badge-ma { background: rgba(244, 63, 94, 0.16); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.38); }
    .badge-tomorrow { background: rgba(56, 189, 248, 0.15); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.38); }
    .badge-pullback-support { background: rgba(16, 185, 129, 0.16); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
    .badge-onboard { background: rgba(245, 158, 11, 0.16); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.38); }
    .badge-volume { background: rgba(249, 115, 22, 0.16); color: #fdba74; border: 1px solid rgba(249, 115, 22, 0.38); }
    .badge-pullback-15 { background: rgba(56, 189, 248, 0.12); color: #bae6fd; border: 1px solid rgba(56, 189, 248, 0.3); }
    .badge-pullback-20 { background: rgba(168, 85, 247, 0.16); color: #d8b4fe; border: 1px solid rgba(168, 85, 247, 0.38); }
    .badge-pullback-30 { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.45); }
    .badge-sky { background: linear-gradient(135deg, rgba(244, 63, 94, 0.25), rgba(245, 158, 11, 0.22)); color: #fde047; border: 1px solid rgba(251, 191, 36, 0.5); }
    .badge-pre-sky { background: rgba(234, 179, 8, 0.15); color: #fef08a; border: 1px solid rgba(234, 179, 8, 0.35); }
    .badge-bo { background: rgba(236, 72, 153, 0.18); color: #f9a8d4; border: 1px solid rgba(236, 72, 153, 0.42); }
    .badge-tight-seam { background: rgba(139, 92, 246, 0.18); color: #ddd6fe; border: 1px solid rgba(139, 92, 246, 0.42); }
    .badge-margins-rising { background: rgba(245, 158, 11, 0.2); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.48); }
    .badge-ahxin-soft { background: rgba(56, 189, 248, 0.16); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.36); }
    .badge-ahxin-medium { background: rgba(99, 102, 241, 0.22); color: #a5b4fc; border: 1px solid rgba(99, 102, 241, 0.45); }
    .badge-ahxin-hard { background: linear-gradient(135deg, rgba(236, 72, 153, 0.25), rgba(244, 63, 94, 0.25)); color: #fda4af; border: 1px solid rgba(244, 63, 94, 0.55); }
    .badge-jet { background: linear-gradient(135deg, rgba(239, 68, 68, 0.28), rgba(249, 115, 22, 0.25)); color: #fecaca; border: 1px solid rgba(239, 68, 68, 0.6); }

    .badge-kd-oversold { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.48); }
    .badge-kd-low-zone { background: rgba(20, 184, 166, 0.15); color: #5eead4; border: 1px solid rgba(20, 184, 166, 0.35); }
    .badge-kd-gold-low { background: linear-gradient(135deg, rgba(16, 185, 129, 0.25), rgba(245, 158, 11, 0.22)); color: #fde68a; border: 1px solid rgba(251, 191, 36, 0.55); }
    .badge-kd-gold { background: rgba(245, 158, 11, 0.15); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.35); }
    .badge-kd-passivate { background: rgba(244, 63, 94, 0.2); color: #fda4af; border: 1px solid rgba(244, 63, 94, 0.45); }

    .btn-pe-pill {
      background: rgba(14, 165, 233, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.42);
      color: #38bdf8;
      padding: 3px 9px;
      border-radius: 7px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-pe-pill:hover { background: rgba(14, 165, 233, 0.32); color: #fff; }

    /* Table Styles */
    .tbl-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
    }

    table.data-tbl {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.84rem;
      text-align: left;
    }

    table.data-tbl thead th {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-secondary);
      font-size: 0.74rem;
      font-weight: 700;
      padding: 10px 8px;
      border-bottom: 1px solid var(--border-subtle);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }

    table.data-tbl thead th:hover { color: #fff; }

    table.data-tbl tbody tr {
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      transition: background 0.12s;
    }

    table.data-tbl tbody tr:hover { background: rgba(99, 102, 241, 0.08); }
    table.data-tbl tbody td { padding: 9px 8px; vertical-align: middle; font-variant-numeric: tabular-nums; }

    .rank-badge {
      display: inline-flex;
      width: 24px;
      height: 24px;
      align-items: center;
      justify-content: center;
      border-radius: 7px;
      font-size: 0.75rem;
      font-weight: 800;
      background: rgba(255,255,255,0.06);
      color: var(--text-secondary);
    }
    .rank-1 { background: linear-gradient(135deg, #fbbf24, #d97706); color: #000; }
    .rank-2 { background: linear-gradient(135deg, #e2e8f0, #94a3b8); color: #000; }
    .rank-3 { background: linear-gradient(135deg, #d97706, #92400e); color: #fff; }

    /* PE River Zone Pills */
    .pe-zone-pill { padding: 4px 10px; border-radius: 99px; font-size: 0.76rem; font-weight: 700; display: inline-block; }
    .pe-zone-cheap { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.5); }
    .pe-zone-fair-low { background: rgba(56, 189, 248, 0.18); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.4); }
    .pe-zone-fair { background: rgba(99, 102, 241, 0.18); color: #a5b4fc; border: 1px solid rgba(99, 102, 241, 0.4); }
    .pe-zone-high { background: rgba(245, 158, 11, 0.18); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.45); }
    .pe-zone-expensive { background: rgba(244, 63, 94, 0.2); color: #fda4af; border: 1px solid rgba(244, 63, 94, 0.45); }

    /* Group Manager Cards */
    .groups-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 12px;
    }

    .group-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .group-card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .sym-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 0.72rem;
      color: #cbd5e1;
    }

    /* Modals */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .modal-backdrop.active { display: flex; }

    .modal-card {
      background: #101726;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 18px;
      width: 100%;
      max-width: 640px;
      max-height: 92vh;
      overflow-y: auto;
      padding: 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      gap: 10px;
    }

    .modal-close {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #cbd5e1;
      width: 30px;
      height: 30px;
      border-radius: 9px;
      font-size: 1.15rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .chart-box {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 12px;
      padding: 10px;
      margin-top: 10px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid rgba(56, 189, 248, 0.5);
      color: #f8fafc;
      padding: 9px 18px;
      border-radius: 99px;
      font-size: 0.82rem;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
      z-index: 2000;
      display: none;
    }
  
    #lock-screen {
      min-height: 82vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;

    function bytesToHex(bytes) {
      let s = '';
      for (let i = 0; i < bytes.length; i++) s += bytes[i].toString(16).padStart(2, '0');
      return s;
    }

    function hexToBytes(hex) {
      const out = new Uint8Array(hex.length / 2);
      for (let i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
      return out;
    }

    function deriveKeyFromPassword(pwd) {
      const enc = new TextEncoder();
      let k = sha256Bytes(enc.encode(SALT + ":" + pwd));
      for (let i = 0; i < 10000; i++) k = sha256Bytes(k);
      return k;
    }

    function tryDecryptWithKey(keyBytes) {
      const keyHex = bytesToHex(keyBytes);
      const checkHash = bytesToHex(sha256Bytes(new TextEncoder().encode("VERIFY:" + keyHex)));
      if (checkHash !== VERIFY_HASH) return false;

      const binStr = atob(CIPHERTEXT_B64);
      const cipherLen = binStr.length;
      const plainBytes = new Uint8Array(cipherLen);
      const numBlocks = Math.ceil(cipherLen / 32);
      const blockInput = new Uint8Array(36);
      blockInput.set(keyBytes, 0);
      const bdv = new DataView(blockInput.buffer);

      for (let bIdx = 0; bIdx < numBlocks; bIdx++) {
        bdv.setUint32(32, bIdx, false);
        const ks = sha256Bytes(blockInput);
        const start = bIdx * 32;
        const end = Math.min(start + 32, cipherLen);
        for (let i = start; i < end; i++) {
          plainBytes[i] = binStr.charCodeAt(i) ^ ks[i - start];
        }
      }

      const jsonStr = new TextDecoder('utf-8').decode(plainBytes);
      const payload = JSON.parse(jsonStr);

      localStorage.setItem('ahwingo_pro_key_v1', keyHex);

      document.getElementById('lock-screen').style.display = 'none';
      const appRoot = document.getElementById('app-root');
      appRoot.style.display = 'block';
      appRoot.innerHTML = payload.html;

      const scriptEl = document.createElement('script');
      scriptEl.textContent = payload.js;
      document.body.appendChild(scriptEl);
      return true;
    }

    function unlockWithPassword() {
      const input = document.getElementById('pwd-input');
      const errEl = document.getElementById('lock-err');
      const pwd = (input.value || '').trim();
      if (!pwd) return;

      const keyBytes = deriveKeyFromPassword(pwd);
      if (!tryDecryptWithKey(keyBytes)) {
        errEl.style.display = 'block';
        input.value = '';
        input.focus();
      }
    }

    (function autoUnlock() {
      try {
        const savedKeyHex = localStorage.getItem('ahwingo_pro_key_v1');
        if (savedKeyHex && savedKeyHex.length === 64) {
          if (tryDecryptWithKey(hexToBytes(savedKeyHex))) return;
          localStorage.removeItem('ahwingo_pro_key_v1');
        }
      } catch (e) {}
    })();
  </script>
